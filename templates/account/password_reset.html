{% load crispy_forms_tags %}

<h4 class="mb-2">Forgot password?</h4>
<p><h5>Forgot your password? Enter your email.</h5></p>
<form action="#" method="POST" class="form-account text-right">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="form-row-account">
        <button class="btn btn-primary btn-login">Password recovery</button>
    </div>
</form>
